[project]
name = "maiven-ingest"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "psycopg[binary]>=3.2,<4", "python-dotenv>=1.1,<2", "beautifulsoup4>=4.13,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]
markers = ["integration: requires TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ingest"]

[tool.setuptools.packages.find]
include = ["ingest*"]
