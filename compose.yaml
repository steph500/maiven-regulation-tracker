services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: maiven
      POSTGRES_USER: maiven
      POSTGRES_PASSWORD: maiven
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U maiven -d maiven']
      interval: 5s
      retries: 10
volumes:
  postgres_data:
